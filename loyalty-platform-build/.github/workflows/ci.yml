name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint / Typecheck / Build / Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Check for hardcoded secrets
        run: |
          # Check for common secret patterns in source files
          if grep -rn "Password=" --include="*.ts" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude="*.test.*" --exclude="*.md" . | grep -v "placeholder" | grep -v "example" | grep -v "SQL_ADMIN_PASSWORD"; then
            echo "::error::Potential hardcoded secrets found"
            exit 1
          fi

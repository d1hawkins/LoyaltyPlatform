name: Setup Node + pnpm
description: Install Node.js and pnpm with caching

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10.26.1

    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
